zabbix_export:
  version: '6.0'
  date: '2026-01-01T00:00:00Z'
  groups:
    - uuid: 04be74725f864716bc83a7df7f862e84
      name: 'Templates/Network devices'
  templates:
    - uuid: ea7bb56ac0194aa3bedca5bf82e0e6ff
      template: 'Huawei OptiX RTN by SNMP'
      name: 'Huawei OptiX RTN by SNMP'
      description: |
        Huawei OptiX RTN microwave radios (RTN 905, 910A, 950A, 980, 380H) by SNMP.
        Common items for all models: NE info, boards and temperatures, ODU power and frequencies, IF modulation and capacity, 15-minute radio performance (RSL/TSL, SNR, MSE), Ethernet/radio port traffic and active alarms.
        Link the model template (e.g. 'Huawei OptiX RTN 950A by SNMP') instead of this one to get model-specific items too.
        Built from SNMP walks of 419 NEs; OIDs from the Huawei OPTIX MIBs.
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: dd5187e99ee94ccdbdc99f04999ee17e
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 593ab82f5aa1424e86851eee9a91cbd6
              expression: 'max(/Huawei OptiX RTN by SNMP/icmpping,#3)=0'
              name: 'Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three ICMP checks failed.'
        - uuid: e744b8e23b044a7da002449cdbeb4fa6
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 093d3853afb840b09a7c12aee6843035
              expression: 'min(/Huawei OptiX RTN by SNMP/icmppingloss,5m)>{$RTN.ICMP.LOSS.WARN} and min(/Huawei OptiX RTN by SNMP/icmppingloss,5m)<100'
              name: 'High ICMP ping loss'
              priority: WARNING
              dependencies:
                - name: 'Unavailable by ICMP ping'
                  expression: 'max(/Huawei OptiX RTN by SNMP/icmpping,#3)=0'
        - uuid: c4157976c2294adcbd26ba58a7dc1520
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 7db0b33c537f47af86b9ef7784ad60f7
              expression: 'avg(/Huawei OptiX RTN by SNMP/icmppingsec,5m)>{$RTN.ICMP.RESPONSE.WARN}'
              name: 'High ICMP ping response time'
              priority: WARNING
              dependencies:
                - name: 'High ICMP ping loss'
                  expression: 'min(/Huawei OptiX RTN by SNMP/icmppingloss,5m)>{$RTN.ICMP.LOSS.WARN} and min(/Huawei OptiX RTN by SNMP/icmppingloss,5m)<100'
                - name: 'Unavailable by ICMP ping'
                  expression: 'max(/Huawei OptiX RTN by SNMP/icmpping,#3)=0'
        - uuid: 95b43203c32142208bce186b99ca0199
          name: 'NE ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2011.2.25.3.40.2.1.1.0
          key: rtn.ne.id
          delay: '{$RTN.INTERVAL.INVENTORY}'
          description: 'NE ID (optixNeID). Extended ID = value / 65536, basic ID = value % 65536.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 573aafe3db5840788149d6bef42c022e
          name: 'NE IP address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2011.2.25.3.40.2.2.1.0
          key: rtn.ne.ip
          delay: '{$RTN.INTERVAL.INVENTORY}'
          trends: '0'
          value_type: CHAR
          description: 'NE IP address (optixNeIP).'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 5cbfb9cb2de341eca4624d0e1d564a9e
          name: 'Device model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2011.2.25.4.30.21.1.8.0
          key: rtn.ne.model
          delay: '{$RTN.INTERVAL.INVENTORY}'
          description: 'Device type (optixNeDeviceType).'
          valuemap:
            name: 'Huawei RTN device type'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 59511c1f45844c0680873125b2cc1323
          name: 'NE name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2011.2.25.4.30.21.1.1.0
          key: rtn.ne.name
          delay: '{$RTN.INTERVAL.INVENTORY}'
          trends: '0'
          value_type: CHAR
          description: 'NE name configured on the device (optixNeName). sysName is always "Optix product" on these radios.'
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: dbe75db1e83741bebc2143ac7ce8993e
          name: 'Software version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: rtn.ne.software
          delay: '{$RTN.INTERVAL.INVENTORY}'
          trends: '0'
          value_type: CHAR
          description: 'sysDescr. Many NEs leave it empty; where set it holds the software version (e.g. V100R019C10SPC300).'
          inventory_link: OS
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: cb2ca283e9b2479b8a5439bb3103919c
          name: 'NE state'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2011.2.25.4.30.21.1.7.0
          key: rtn.ne.state
          delay: '{$RTN.INTERVAL.STATUS}'
          description: 'NE status (optixNeState): installing or running.'
          valuemap:
            name: 'Huawei RTN NE state'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: a61a2b6b0a034cefae49ce19b9aa5a89
              expression: 'last(/Huawei OptiX RTN by SNMP/rtn.ne.state)=0'
              name: 'NE is not in running state'
              priority: AVERAGE
              description: 'The NE reports the install state (optixNeState=0), e.g. during a software load.'
        - uuid: ec11076249004e689a8eaf54ac05d6f7
          name: Uptime
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: rtn.ne.uptime
          delay: '{$RTN.INTERVAL.STATUS}'
          value_type: FLOAT
          units: uptime
          description: 'sysUpTime. Note: the 32-bit counter wraps after 497 days, which looks like a restart.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 2f1eded1c2e44868a29b534894cbdfe2
              expression: 'last(/Huawei OptiX RTN by SNMP/rtn.ne.uptime)<10m'
              name: 'Device has been restarted (uptime < 10m)'
              priority: WARNING
              description: 'Uptime is under 10 minutes. A sysUpTime wrap after 497 days also triggers this.'
              manual_close: 'YES'
        - uuid: 40a918d8857c4d05ac7c8720778f94b8
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: 'Zabbix internal check: 0 = SNMP not available, 1 = available.'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: ac7fa2ed0d1942b6a1ac9b9636daf09e
              expression: 'max(/Huawei OptiX RTN by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'No SNMP data collection'
              priority: AVERAGE
              description: 'The SNMP agent has not answered for {$SNMP.TIMEOUT}.'
              dependencies:
                - name: 'Unavailable by ICMP ping'
                  expression: 'max(/Huawei OptiX RTN by SNMP/icmpping,#3)=0'
      discovery_rules:
        - uuid: 1cffee1e3644460a819f9ab02890b8c3
          name: 'Active alarm discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ALM.EID},1.3.6.1.4.1.2011.2.25.3.40.30.10.10.1.2,{#ALM.SEV},1.3.6.1.4.1.2011.2.25.3.40.30.10.10.1.3,{#ALM.PARA},1.3.6.1.4.1.2011.2.25.3.40.30.10.10.1.9]'
          key: rtn.alarm.discovery
          delay: '{$RTN.INTERVAL.ALARM}'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ALM.EID}'
                value: '{$RTN.ALARM.EID.IGNORE}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              - macro: '{#ALM.SEV}'
                value: '^[123]$'
                formulaid: B
          lifetime: 1h
          description: 'One entity per active critical/major/minor alarm (curAlmDataTable). Alarm IDs matching {$RTN.ALARM.EID.IGNORE} are skipped.'
          item_prototypes:
            - uuid: 49a122431a0b4951a8ed523ef231a697
              name: 'Alarm {#ALM.NAME} ({#ALM.LOCATION}): Severity'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2011.2.25.3.40.30.10.10.1.3.{#SNMPINDEX}'
              key: 'rtn.alarm.severity[{#SNMPINDEX}]'
              description: 'Severity of an active alarm (curAlmSeverity). Alarm ID {#ALM.EID}.'
              valuemap:
                name: 'Huawei RTN alarm severity'
              tags:
                - tag: alarm
                  value: '{#ALM.NAME}'
                - tag: component
                  value: alarm
              trigger_prototypes:
                - uuid: 6a7c81009022446a9766aadb879ea5ad
                  expression: 'last(/Huawei OptiX RTN by SNMP/rtn.alarm.severity[{#SNMPINDEX}])=1 and nodata(/Huawei OptiX RTN by SNMP/rtn.alarm.severity[{#SNMPINDEX}],{$RTN.ALARM.NODATA})=0'
                  name: '{#ALM.NAME} ({#ALM.LOCATION}) [critical]'
                  priority: HIGH
                  description: 'Active alarm on the NE (curAlmDataTable). It clears when the alarm leaves the table.'
                - uuid: b1222421acd84f55bcbc83b29b75ba11
                  expression: 'last(/Huawei OptiX RTN by SNMP/rtn.alarm.severity[{#SNMPINDEX}])=2 and nodata(/Huawei OptiX RTN by SNMP/rtn.alarm.severity[{#SNMPINDEX}],{$RTN.ALARM.NODATA})=0'
                  name: '{#ALM.NAME} ({#ALM.LOCATION}) [major]'
                  priority: AVERAGE
                  description: 'Active alarm on the NE (curAlmDataTable). It clears when the alarm leaves the table.'
                - uuid: 05db326c21db4ba5b221580192357522
                  expression: 'last(/Huawei OptiX RTN by SNMP/rtn.alarm.severity[{#SNMPINDEX}])=3 and nodata(/Huawei OptiX RTN by SNMP/rtn.alarm.severity[{#SNMPINDEX}],{$RTN.ALARM.NODATA})=0'
                  name: '{#ALM.NAME} ({#ALM.LOCATION}) [minor]'
                  priority: WARNING
                  description: 'Active alarm on the NE (curAlmDataTable). It clears when the alarm leaves the table.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function rows(value) {
                      var d = JSON.parse(value);
                      return Array.isArray(d) ? d : (d.data || []);
                  }
                  // index "26.26.98.111..." or "26.98.111..." -> the ASCII string it encodes
                  function idxString(idx) {
                      var p = String(idx).split('.');
                      for (var i = 0; i < p.length; i++) {
                          if (p.length - i - 1 === parseInt(p[i], 10)) {
                              var s = '';
                              for (var j = i + 1; j < p.length; j++) s += String.fromCharCode(parseInt(p[j], 10));
                              return s;
                          }
                      }
                      return String(idx);
                  }
                  // "board=17,subcard=255,port=5" -> {board: 17, subcard: 255, port: 5}
                  function location(s) {
                      var o = {};
                      String(s).split(',').forEach(function (kv) {
                          var a = kv.split('=');
                          if (a.length === 2) o[a[0].trim()] = parseInt(a[1], 10);
                      });
                      return o;
                  }
                  // ODU slot -> IF slot/port: +20/+40 on RTN 905/910A/950A, +50/+70 on RTN 980, same slot on RTN 380H
                  function oduName(slot) {
                      var b = [[70, 2], [50, 1], [40, 2], [20, 1]];
                      for (var i = 0; i < b.length; i++)
                          if (slot > b[i][0]) return 'ODU ' + slot + ' (IF ' + (slot - b[i][0]) + '/' + b[i][1] + ')';
                      return 'ODU ' + slot + ' (IF ' + slot + '/1)';
                  }
